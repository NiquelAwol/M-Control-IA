services:
  # Servicio Web / Frontend & Prototipo
  mcontrol-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcontrol_web
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./Proyecto:/usr/share/nginx/html:ro

  # Servicio de Inteligencia Artificial (Pandas, Seaborn, Perceptrón con NumPy)
  python_ia:
    build:
      context: .
      dockerfile: Dockerfile.ia
    container_name: python_ia
    volumes:
      - .:/app
    command: python perceptron_proyecto.py

services:
  # Servicio Web + API de IA Unificado (Frontend + SQLite + Motor ML en Puerto 8088)
  mcontrol-app:
    build:
      context: .
      dockerfile: Dockerfile.ia
    container_name: mcontrol_web
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8088:8088"
    volumes:
      - .:/app
    command: python -m mcontrol_ai.api_service

  # Servicio de Inteligencia Artificial para consola interactiva (Clases 7, 8 y 9)
  python_ia:
    build:
      context: .
      dockerfile: Dockerfile.ia
    container_name: python_ia
    working_dir: /app/src
    volumes:
      - .:/app
    command: python perceptron_proyecto.py
